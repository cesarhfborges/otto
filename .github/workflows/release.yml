name: Release

# Merge em `master` gera a versão final; merge em `beta` gera uma pre-release (`-beta.N`).
# A versão vem dos commits (Conventional Commits) via semantic-release.
#
# Etapas: version → (linux + windows + mac, em paralelo) → publish.
# A release só é publicada se todos os builds passarem; qualquer falha interrompe o processo
# antes de criar tag ou release.
on:
    push:
        branches: [master, beta]

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    # Calcula a próxima versão sem publicar (vazia quando os commits não geram release).
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.next.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - id: next
              run: node scripts/next-version.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    linux:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: ubuntu-latest
        # Imagem oficial do electron-builder: já traz Node, git e as dependências do AppImage/.deb.
        container: electronuserland/builder
        steps:
            - uses: actions/checkout@v4
            - run: npm ci
            - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
              env:
                  VERSION: ${{ needs.version.outputs.version }}
            - run: npm run dist:linux
              env:
                  HOME: /root
            - uses: actions/upload-artifact@v4
              with:
                  name: release-linux
                  path: |
                      release/*.AppImage
                      release/*.deb
                      release/*.yml
                      release/*.blockmap
                  if-no-files-found: error

    # O instalador NSIS roda nativamente no Windows (o Wine falha dentro de containers do Actions).
    windows:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
              env:
                  VERSION: ${{ needs.version.outputs.version }}
            - run: npm run dist:win
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
            - uses: actions/upload-artifact@v4
              with:
                  name: release-windows
                  path: |
                      release/*.exe
                      release/*.yml
                      release/*.blockmap
                  if-no-files-found: error

    # O .dmg só pode ser gerado no macOS.
    mac:
        needs: version
        if: needs.version.outputs.version != ''
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
              env:
                  VERSION: ${{ needs.version.outputs.version }}
            - run: npm run build && node scripts/dist-release.mjs --mac
              env:
                  # Sem certificado da Apple: o app sai com assinatura ad-hoc, sem notarização.
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
            - uses: actions/upload-artifact@v4
              with:
                  name: release-mac
                  path: |
                      release/*.dmg
                      release/*.zip
                      release/*.yml
                      release/*.blockmap
                  if-no-files-found: error

    # Só roda com todos os builds aprovados: cria a tag e a release com os arquivos de todas as plataformas.
    publish:
        needs: [version, linux, windows, mac]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  path: release
                  merge-multiple: true
            - run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  EXPECTED_VERSION: ${{ needs.version.outputs.version }}

name: Release

# Merge em `master` gera a versão final; merge em `beta` gera uma pre-release (`-beta.N`).
# A versão vem dos commits (Conventional Commits) via semantic-release.
on:
    push:
        branches: [master, beta]

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            # O instalador do Windows é gerado aqui mesmo; o Wine grava ícone e metadados no .exe.
            - name: Install Wine
              run: |
                  sudo dpkg --add-architecture i386
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends wine64 wine32
            - run: npm ci
            - run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

# Todo PR precisa compilar antes do merge. Nada é publicado aqui.
on:
    pull_request:
        branches: [master, beta]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --loglevel=error
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run build
            - run: npm run test:electron
            # axe-core no app real (claro e escuro) + violações de CSP no console. Sem tela: Xvfb.
            - run: xvfb-run -a npm run audit:a11y

name: CI

# Todo PR precisa compilar antes do merge. Nada é publicado aqui.
on:
    pull_request:
        branches: [master, beta]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci --loglevel=error
            - run: npm run typecheck
            - run: npm run build
